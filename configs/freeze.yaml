  manifest: data/full_series_ids_with_class.csv   # scripts/prepare_full_manifest.py; lớp nhu cầu theo tỷ lệ ngày 0 trên d_1..d_1885 (cùng quy tắc mẫu)
  manifest_sha256: 56a6267c780b27e917d143db3ad351c0cca278a0f8d84ef2e227f90e0080bc68   # m5.sample.manifest_hash
  n_series: 30490
  models_core: [seasonal_naive, ets, lightgbm]        # cấu hình như v1 (LightGBM mặc định thư viện, cùng đặc trưng)
  models_new: [croston_sba, stacking]                  # X01; T02 lai
  stacking: {meta: ridge, alphas: [0.1, 1, 10, 100, 1000], alpha_selection: leave-one-origin-out, oof_origins: [1829, 1857], bases: [ets, croston_sba, lightgbm], lgbm_in_stack: default, clip_at_zero: true}
  dropped: [linear_regression, croston, xgboost, catboost, lightgbm_tuned, lightgbm_noprice]   # còn trong mã và trong kết quả pilot 1.200 chuỗi
  code_changes: "build_table dựng cột phân loại từ mã số (không tạo chuỗi chữ cho từng dòng) và giữ số thực float64: dự báo LightGBM trên 1.200 chuỗi trùng bản đã lưu (lệch tối đa 1,8e-15); evaluator vector hóa, khớp bản cũ (lệch tối đa 1,4e-13); backtest_oof thêm mô hình cục bộ; run_stacking nhận --bases"
  jobs: "scripts/kaggle_full_run.py --task validation | test | oof --origins 1829 | oof --origins 1857 (mỗi job một notebook Kaggle)"
  runs: {validation: val-20261118T054238Z-c8ba5c8, test: tes-20261118T054917Z-c8ba5c8, oof: [results/full/oof/oof_1829.parquet, results/full/oof/oof_1857.parquet], stacking: [val-20261118T083718Z-867b564-stack, tes-20261118T083859Z-867b564-stack]}
  caveat: "Nhãn Test đã được xem trên 1.200 chuỗi (3,9% số chuỗi) trước khi chốt bộ 5 mô hình, nên Test toàn bộ không còn hoàn toàn mù"
