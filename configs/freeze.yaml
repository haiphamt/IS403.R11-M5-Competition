  20b22f7: d8fe7a1375c3be156aa6a5f657d9f8c61defd3d5   # Gộp PR #6
  4cc19f7: c1985e1db0ae8ec7b075fa804b0dcdc292e337f5   # Gộp PR #13
  4994dda: b080335660de0b2b3baab670157b6263c43be1d5   # Gộp PR #15
archive_tags:
  - archive/pre-rewrite-4994dda   # run Test CatBoost; lịch sử sạch (không có dòng đồng tác giả AI), còn trên GitHub
  # archive/pre-rewrite-20b22f7 và archive/pre-rewrite-4cc19f7 đã gỡ khỏi GitHub: lịch sử của chúng có 10 commit mang dòng đồng tác giả Claude; chỉ còn bản cục bộ.
code_ref_after_rewrite: 9dca59fd979e8bcfdaceec98b1cefe0f9c7c5866    # thẻ config-freeze; src/, configs/, run_experiment.py giống hệt main 7e2543c
validation_runs:
  - val-20261115T072831Z-20b22f7   # seasonal_naive, linear_regression, ets, croston, lightgbm, xgboost
  - val-20261115T073404Z-20b22f7   # catboost
sample:
  n_series: 1200
  seed: 42
  stratify_by: [store_id, cat_id]
  per_stratum: 40
  manifest: data/sample_series_ids.csv
  manifest_sha256_definition: "sha256 của các series_id đã sắp xếp, nối bằng xuống dòng; xem m5.sample.manifest_hash (không phải hash của tệp CSV)"
  manifest_sha256: 68d7acc8ef39f266d5b8274569fc25869c4187ba160a07686a2b292b0d5940f4
splits: {train: [1, 1885], validation: [1886, 1913], test: [1914, 1941]}
test_recipe: refit every model on d_1..d_1913 with the same configuration, forecast d_1914..d_1941 once
models_evaluated: [seasonal_naive, linear_regression, ets, croston, lightgbm, xgboost, catboost]
features:
  numeric: [lag_28, lag_35, lag_42, rolling_mean_7, rolling_std_7, rolling_mean_28, rolling_std_28, year, snap, sell_price, price_missing]
  categorical: [dept_id, cat_id, store_id, state_id, wday, month, event_name_1, event_type_1, event_name_2, event_type_2]
  excluded: [item_id]      # high cardinality; deviation from configs/features.yaml, documented in the report
future_exogenous_assumption: "calendar, SNAP and weekly prices of the forecast days are treated as known at the origin (M5 publishes prices to d_1969); not a statement about real-world price planning"
metric_policy:
  per_series: [mae, rmse, rmsse, r2]
  rmsse_scale: "one-step naive MSE on d_1..origin after the first non-zero sale"
  undefined_handling: "NaN with reason, excluded from macro mean, counted; no epsilon"
  aggregation: "macro mean over series where defined (ranking: macro_rmsse); pooled MAE/RMSE reported separately"
postprocessing: "clip y_pred at 0 for every model; no rounding"
seeds: {global_models: 42}
runtime_reporting: "local models: sum of per-series fit+predict; global models: pooled fit+predict; features/IO/warm-up separate; Kaggle CPU, 4 vCPU"
freeze_tags_removed: "18/11/2026: các tag config-freeze và config-freeze-v2 đã gỡ khỏi GitHub theo yêu cầu của nhóm; khi chưa có tag, scripts/run_experiment.py khóa split test. Cấu hình bên dưới vẫn là cấu hình đã dùng cho các run Test hiện có."
optional_decisions:     # trạng thái sau PR #24; v1 ở trên (7 mô hình lõi) không đổi
  T01_optuna_tuned_lightgbm: validation_done   # 30 lượt, chỉ nhãn Validation; best_params ở configs/models/lightgbm_tuned.json, nhật ký ở results/tuning/
  T02_stacking_ridge: validation_done          # OOF ở results/oof/ (mốc 1829, 1857); run stacking Validation: val-20261116T064518Z-c4f7409-stack; Test chưa chạy
  X01_croston_sba: validation_done
  X02_lightgbm_without_price_event: validation_done
  validation_run_optional: val-20261116T015146Z-2ee03bd   # croston_sba, lightgbm_noprice, lightgbm_tuned (mã nguồn 2ee03bd)
  config_freeze_v2: removed                    # 18/11/2026: đã tạo tag config-freeze-v2 (commit 5fac4bf), chạy Test tùy chọn (tes-20261118T033447Z-5fac4bf, tes-20261118T034102Z-5fac4bf-stack), rồi gỡ tag theo yêu cầu của nhóm để còn chạy và sửa tiếp; tạo lại tag khi chốt
  config_freeze_v2_frozen:                     # những gì bị khóa ở v2 (ngoài mọi thứ ở v1)
    lightgbm_tuned_json_sha256: d7b31d3be861772ae4f384edc555c1e00c110b765e733515739a7e21ba2e4b2e   # configs/models/lightgbm_tuned.json (30 lượt Optuna, chỉ nhãn Validation)
    oof_sha256:                                # OOF trong Train (nhãn <= d_1885) để khớp Ridge của stacking
      oof_catboost.parquet: 6bc6659d99e5011a70da67d19eb5535e4f0da13dd341a6df4d630ea5d9bd87e9
      oof_linear_regression_lightgbm_lightgbm_tuned_xgboost.parquet: eede08ce18cea1e6b4c609f7129fd91279ecd5eb6cc54fc04bcb6e274f2b9bcd
    stacking: {meta: ridge, alpha: 1000.0, lgbm_in_stack: tuned, bases: [linear_regression, lightgbm, xgboost, catboost], clip_at_zero: true}   # alpha chọn ở run Validation val-20261116T064518Z-c4f7409-stack
    test_commands:
      - "python scripts/run_experiment.py --split test --models croston_sba lightgbm_noprice lightgbm_tuned --lgbm-params configs/models/lightgbm_tuned.json"
      - "python scripts/run_stacking.py --split test --oof results/oof/*.parquet --lgbm tuned --base-runs <run Test lõi (LR, XGBoost), run Test CatBoost, run Test tùy chọn>"
  note: "Nhãn Test của 7 mô hình lõi đã mở trước v2, nên Test của phần tùy chọn không còn là dữ liệu giữ lại hoàn toàn."
code_changes_since_v1: "PR #24 thêm mã phần tùy chọn; sửa theo review chỉ đổi cách ghi tham số XGBoost (model_parameters.json) và trường git_dirty (loại results/), không đụng đường huấn luyện/dự báo; khóa Test siết chặt (tag phải nằm trong HEAD, cây sạch, kể cả --max-series) và ghi SHA-256 của năm CSV; requirements.txt chỉ thêm optuna và python-pptx. Đã kiểm: chạy lại LightGBM trên Validation bằng mã mới trùng bản đã lưu (lệch tối đa 3,5e-18). XGBoost chạy lại ở máy cục bộ (xgboost 3.2.0) khác bản Kaggle (3.4.1) nên không đối chiếu được ở đó."
full_data_v3:   # 18/11/2026: nghiên cứu chính chuyển sang TOÀN BỘ 30.490 chuỗi và 5 mô hình; tag config-freeze và config-freeze-v2 được tạo lại tại commit c8ba5c8 (mã của cả bốn job Kaggle; thay cho các tag đã gỡ)
