# C03 pilot only: one local model per series. No tuning / early stopping.
# Learning parameters match LGBMRegressor defaults; runtime controls explicit.
parameters:
  boosting_type: gbdt
  objective: regression
  n_estimators: 100
  learning_rate: 0.1
  num_leaves: 31
  max_depth: -1
  min_child_samples: 20
  subsample: 1.0
  colsample_bytree: 1.0
  reg_alpha: 0.0
  reg_lambda: 0.0
  random_state: 42
  n_jobs: 2
  deterministic: true
  force_col_wise: true
  verbosity: -1
